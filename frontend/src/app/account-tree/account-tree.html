<div class="flex h-full flex-col">
  <div class="flex items-center justify-between border-b border-slate-200 px-3 py-2">
    <h2 class="text-xs font-semibold uppercase tracking-wide text-slate-500">Accounts</h2>
    <button
      type="button"
      class="rounded px-2 py-0.5 text-sm text-slate-600 hover:bg-slate-200"
      (click)="showNewAccount.set(!showNewAccount())"
      [attr.aria-expanded]="showNewAccount()"
    >
      + New
    </button>
  </div>

  @if (showNewAccount()) {
    <form
      [formGroup]="newAccountForm"
      (ngSubmit)="createAccount()"
      class="flex flex-col gap-2 border-b border-slate-200 bg-slate-50 p-3 text-sm"
    >
      <input
        formControlName="path"
        placeholder="Assets:Current Assets:Checking"
        class="w-full rounded border border-slate-300 px-2 py-1"
        autocomplete="off"
      />
      <div class="flex gap-2">
        <select
          formControlName="type"
          class="min-w-0 flex-1 rounded border border-slate-300 px-2 py-1"
        >
          @for (t of types; track t.value) {
            <option [value]="t.value">{{ t.label }}</option>
          }
        </select>
        <input
          formControlName="currency"
          maxlength="3"
          placeholder="USD"
          class="w-16 rounded border border-slate-300 px-2 py-1 uppercase"
          autocomplete="off"
        />
      </div>
      <button
        type="submit"
        class="rounded bg-sky-600 px-2 py-1 text-white disabled:opacity-50"
        [disabled]="newAccountForm.invalid || ledger.loading()"
      >
        Add account
      </button>
    </form>
  }

  <nav class="flex-1 overflow-y-auto py-1" aria-label="Account tree">
    @if (rows().length === 0) {
      <p class="px-3 py-2 text-sm text-slate-500">No accounts yet.</p>
    }
    @for (row of rows(); track row.account.id) {
      <div
        class="flex w-full cursor-pointer items-center gap-1 px-2 py-1 text-left text-sm hover:bg-slate-100"
        [class.bg-sky-100]="row.account.id === ledger.selectedAccountId()"
        [class.font-medium]="row.account.id === ledger.selectedAccountId()"
        role="button"
        tabindex="0"
        (click)="select(row.account.id)"
        (keydown.enter)="select(row.account.id)"
      >
        <span class="shrink-0" [style.width.rem]="row.depth * 0.9"></span>
        @if (row.children.length > 0) {
          <button
            type="button"
            class="w-4 shrink-0 text-center text-slate-400 hover:text-slate-700"
            [attr.aria-label]="collapsed().has(row.account.id) ? 'Expand' : 'Collapse'"
            (click)="$event.stopPropagation(); toggle(row.account.id)"
          >
            {{ collapsed().has(row.account.id) ? '▸' : '▾' }}
          </button>
        } @else {
          <span class="w-4 shrink-0"></span>
        }
        <span class="min-w-0 flex-1 truncate">{{ row.account.name }}</span>
        <span
          class="shrink-0 tabular-nums text-slate-700"
          [class.text-red-600]="row.total.startsWith('-')"
        >
          {{ formatAmount(row.total) }}
        </span>
      </div>
    }
  </nav>
</div>
